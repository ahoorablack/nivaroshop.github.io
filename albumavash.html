<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلبوم برادر کوچک من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: linear-gradient(135deg, #e0f2fe 0%, #fef08a 100%);
        font-family: 'Vazirmatn', Tahoma, sans-serif;
        min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; position: relative; padding: 20px;
    }

    /* دکمه موزیک */
    .music-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255,255,255,0.8);
        border: 2px solid #38bdf8;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
    }
    .music-btn:hover { transform: scale(1.1); background: #e0f2fe; }
    .music-btn.playing { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(56, 189, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); } }

    .bg-icon { position: absolute; font-size: 50px; animation: float 4s ease-in-out infinite; z-index: 1; opacity: 0.6; }
    @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-25px) rotate(10deg); } 100% { transform: translateY(0px) rotate(0deg); } }

    .album-container {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        padding: 30px;
        box-shadow: 0 20px 50px rgba(250, 204, 21, 0.3);
        border: 4px dashed #facc15;
        text-align: center;
        position: relative;
        z-index: 10;
        max-width: 500px;
        width: 100%;
    }

    h1 { color: #0369a1; font-size: clamp(24px, 6vw, 36px); font-weight: 900; margin-bottom: 5px; }
    .subtitle { color: #ca8a04; font-size: 16px; font-weight: 700; margin-bottom: 25px; }

    .photo-frame {
        width: 300px; height: 300px;
        max-width: 100%;
        margin: 0 auto 25px;
        border-radius: 30px;
        border: 8px solid white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 0 0 4px #7dd3fc;
        overflow: hidden;
        position: relative;
        transition: all 0.5s ease;
    }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .photo-frame:hover img { transform: scale(1.1); }

    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
    .nav-btn {
        background: #38bdf8; color: white; border: none;
        width: 60px; height: 60px; border-radius: 50%;
        font-size: 24px; cursor: pointer; transition: all 0.3s ease;
        display: flex; justify-content: center; align-items: center;
        box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); border: 3px solid #fff;
    }
    .nav-btn:hover { background: #0284c7; transform: scale(1.1) rotate(5deg); }
    .nav-btn:active { transform: scale(0.9); }

    .counter { font-size: 20px; font-weight: 900; color: #0369a1; background: #e0f2fe; padding: 5px 15px; border-radius: 20px; }
    .caption { font-size: 22px; font-weight: 900; color: #ca8a04; margin-top: 10px; min-height: 30px; transition: opacity 0.3s ease; }
</style>
</head>
<body>

    <!-- آهنگ (فقط برای بار اول که دکمه زده میشه پخش میشه) -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    
    <!-- دکمه پخش موزیک -->
    <button class="music-btn" id="music-btn" onclick="toggleMusic()">🎵</button>

    <div class="bg-icon" style="top: 10%; left: 10%;">🧸</div>
    <div class="bg-icon" style="top: 15%; right: 15%; animation-delay: 1s;">🚗</div>
    <div class="bg-icon" style="bottom: 15%; left: 15%; animation-delay: 2s;">🦁</div>
    <div class="bg-icon" style="bottom: 20%; right: 10%; animation-delay: 1.5s;">🍭</div>
    <div class="bg-icon" style="top: 50%; left: 5%; animation-delay: 0.5s;">⭐</div>
    <div class="bg-icon" style="top: 60%; right: 5%; animation-delay: 2.5s;">🎈</div>

    <div class="album-container">
        <h1>برادر کوچک من</h1>
        <div class="subtitle">۱ سال و ۳ ماهگی 🎈</div>

        <div class="photo-frame">
            <img id="current-photo" src="brother/1.jpg" alt="عکس برادر">
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="changePhoto(-1)">❮</button>
            <div class="counter" id="photo-counter">۱ / ۲۰</div>
            <button class="nav-btn" onclick="changePhoto(1)">❯</button>
        </div>

        <div class="caption" id="caption-text">شیطونک کوچولوی ما 🍼</div>
    </div>

<script>
    // لیست ۲۰ عکس برای برادر
    const photos = [
        { src: "brother/1.jpg", caption: "شیطونک کوچولوی ما 🍼" },
        { src: "brother/2.jpg", caption: "این چشم‌های ناز 😍" },
        { src: "brother/3.jpg", caption: "دنیای من رو روشن کردی ☀️" },
        { src: "brother/4.jpg", caption: "عشق منی برادر کوچولو 💙" },
        { src: "brother/5.jpg", caption: "لبخندت قلبمو آب میکنه 🥰" },
        { src: "brother/6.jpg", caption: "بامزه‌ترین پسر دنیا 🦁" },
        { src: "brother/7.jpg", caption: "بزرگ شدنت رو می‌بینم 🌱" },
        { src: "brother/8.jpg", caption: "همیشه مراقبت هستم 🛡️" },
        { src: "brother/9.jpg", caption: "خنده‌هات آرومم میکنه 😌" },
        { src: "brother/10.jpg", caption: "قهرمان کوچولوی من 🏆" },
        { src: "brother/11.jpg", caption: "این لپ‌های گلی 🍑" },
        { src: "brother/12.jpg", caption: "آتیش‌پاره‌ی خونه 🔥" },
        { src: "brother/13.jpg", caption: "دوست داشتنی‌ترین موجود دنیا 💕" },
        { src: "brother/14.jpg", caption: "وقتی می‌خندی، دنیا قشنگ‌تره ✨" },
        { src: "brother/15.jpg", caption: "بغلت خیلی گرمه 🤗" },
        { src: "brother/16.jpg", caption: "با اسباب‌بازی‌هات چی کار می‌کنی؟ 🧸" },
        { src: "brother/17.jpg", caption: "پسر خوب و آروم 🌙" },
        { src: "brother/18.jpg", caption: "همیشه بخند، همیشه شاد 😁" },
        { src: "brother/19.jpg", caption: "برادر بهترین دنیا 🌍" },
        { src: "brother/20.jpg", caption: "خاطرات خوب با تو 💙" }
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById('current-photo');
    const counterElement = document.getElementById('photo-counter');
    const captionElement = document.getElementById('caption-text');

    function updateAlbum() {
        imgElement.style.opacity = '0';
        imgElement.style.transform = 'scale(0.8) rotate(-5deg)';
        setTimeout(() => {
            imgElement.src = photos[currentIndex].src;
            captionElement.innerText = photos[currentIndex].caption;
            const faIndex = (currentIndex + 1).toLocaleString('fa-IR');
            const faLength = photos.length.toLocaleString('fa-IR');
            counterElement.innerText = `${faIndex} / ${faLength}`;
            imgElement.style.opacity = '1';
            imgElement.style.transform = 'scale(1) rotate(0deg)';
        }, 300);
    }

    function changePhoto(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = photos.length - 1;
        else if (currentIndex >= photos.length) currentIndex = 0;
        updateAlbum();
    }
    updateAlbum();

    // کدهای مربوط به موزیک
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            musicBtn.innerText = '🎵';
            musicBtn.classList.remove('playing');
        } else {
            music.play();
            musicBtn.innerText = '⏸️';
            musicBtn.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }
</script>
</body>
</html>
