<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آلبوم فرشته کوچک ما</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
        font-family: 'Vazirmatn', Tahoma, sans-serif;
        min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; position: relative; padding: 20px;
    }

    /* دکمه موزیک */
    .music-btn {
        position: absolute; top: 20px; left: 20px;
        background: rgba(255,255,255,0.8); border: 2px solid #f472b6;
        width: 50px; height: 50px; border-radius: 50%;
        font-size: 24px; cursor: pointer; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(244, 114, 182, 0.3);
    }
    .music-btn:hover { transform: scale(1.1); background: #fce7f3; }
    .music-btn.playing { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(244, 114, 182, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0); } }

    .bg-icon { position: absolute; color: rgba(236, 72, 153, 0.1); font-size: 40px; animation: float 6s ease-in-out infinite; z-index: 1; }
    @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-30px) rotate(15deg); } 100% { transform: translateY(0px) rotate(0deg); } }

    .album-container {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        padding: 30px;
        box-shadow: 0 20px 50px rgba(236, 72, 153, 0.15);
        text-align: center;
        position: relative;
        z-index: 10;
        max-width: 500px;
        width: 100%;
    }

    h1 { color: #db2777; font-size: clamp(24px, 6vw, 36px); font-weight: 900; margin-bottom: 10px; }
    .subtitle { color: #f472b6; font-size: 16px; font-weight: 700; margin-bottom: 25px; }

    .photo-frame {
        width: 300px; height: 300px;
        max-width: 100%;
        margin: 0 auto 25px;
        border-radius: 50%;
        border: 8px solid white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1), 0 0 0 4px #fbcfe8;
        overflow: hidden;
        position: relative;
        transition: all 0.5s ease;
    }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .photo-frame:hover img { transform: scale(1.05); }

    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
    .nav-btn {
        background: #f472b6; color: white; border: none;
        width: 50px; height: 50px; border-radius: 50%;
        font-size: 20px; cursor: pointer; transition: all 0.3s ease;
        display: flex; justify-content: center; align-items: center;
        box-shadow: 0 5px 15px rgba(244, 114, 182, 0.3);
    }
    .nav-btn:hover { background: #db2777; transform: scale(1.1); }
    .nav-btn:active { transform: scale(0.9); }

    .counter { font-size: 18px; font-weight: 700; color: #9d174d; background: #fce7f3; padding: 5px 12px; border-radius: 20px; }
    .caption { font-size: 20px; font-weight: 800; color: #db2777; margin-top: 10px; min-height: 30px; transition: opacity 0.3s ease; }
</style>
</head>
<body>

    <!-- آهنگ (فقط برای بار اول که دکمه زده میشه پخش میشه) -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    
    <!-- دکمه پخش موزیک -->
    <button class="music-btn" id="music-btn" onclick="toggleMusic()">🎵</button>

    <div class="bg-icon" style="top: 10%; left: 10%;">🧸</div>
    <div class="bg-icon" style="top: 20%; right: 15%; animation-delay: 1s;">🎀</div>
    <div class="bg-icon" style="bottom: 15%; left: 20%; animation-delay: 2s;">⭐</div>
    <div class="bg-icon" style="bottom: 25%; right: 10%; animation-delay: 3s;">🍼</div>
    <div class="bg-icon" style="top: 50%; left: 5%; animation-delay: 1.5s;">💖</div>
    <div class="bg-icon" style="top: 60%; right: 5%; animation-delay: 2.5s;">🌸</div>

    <div class="album-container">
        <h1>فرشته‌ی کوچک ما</h1>
        <div class="subtitle">آلبوم عکس دختر دایی گلم 💕</div>

        <div class="photo-frame">
            <img id="current-photo" src="album/1.jpg" alt="عکس دختر دایی">
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="changePhoto(-1)">❮</button>
            <div class="counter" id="photo-counter">۱ / ۲۰</div>
            <button class="nav-btn" onclick="changePhoto(1)">❯</button>
        </div>

        <div class="caption" id="caption-text">۹ ماهگی 🎀</div>
    </div>

<script>
    // لیست ۲۰ عکس برای دختر دایی
    const photos = [
        { src: "album/1.jpg", caption: "۹ ماهگی 🎀" },
        { src: "album/2.jpg", caption: "اون چشم‌های نازت 🥺" },
        { src: "album/3.jpg", caption: "خنده‌های قشنگت 😍" },
        { src: "album/4.jpg", caption: "فرشته‌ی کوچک ما 💖" },
        { src: "album/5.jpg", caption: "دنیای زندایی رو روشن کردی ✨" },
        { src: "album/6.jpg", caption: "این لپ‌های گلی 🍑" },
        { src: "album/7.jpg", caption: "شاهزاده خانم کوچولو 👑" },
        { src: "album/8.jpg", caption: "همیشه شاد باشی 🌸" },
        { src: "album/9.jpg", caption: "نازترین دختر دنیا 💕" },
        { src: "album/10.jpg", caption: "لبخندت مثل بهاره 🌷" },
        { src: "album/11.jpg", caption: "دستای کوچولوت 👐" },
        { src: "album/12.jpg", caption: "خواب‌های قشنگ ببینی 🌙" },
        { src: "album/13.jpg", caption: "عزیز دل زندایی 💖" },
        { src: "album/14.jpg", caption: "این موهای ناز 😍" },
        { src: "album/15.jpg", caption: "قلب کوچولوی ما 🫀" },
        { src: "album/16.jpg", caption: "با اسباب‌بازی‌هات چی کار می‌کنی؟ 🧸" },
        { src: "album/17.jpg", caption: "دختر خوب و آروم 🌸" },
        { src: "album/18.jpg", caption: "همیشه بخند، همیشه شاد 😁" },
        { src: "album/19.jpg", caption: "فرشته‌ی زمینی 🌍" },
        { src: "album/20.jpg", caption: "خاطرات خوب با تو 💖" }
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById('current-photo');
    const counterElement = document.getElementById('photo-counter');
    const captionElement = document.getElementById('caption-text');

    function updateAlbum() {
        imgElement.style.opacity = '0';
        setTimeout(() => {
            imgElement.src = photos[currentIndex].src;
            captionElement.innerText = photos[currentIndex].caption;
            const faIndex = (currentIndex + 1).toLocaleString('fa-IR');
            const faLength = photos.length.toLocaleString('fa-IR');
            counterElement.innerText = `${faIndex} / ${faLength}`;
            imgElement.style.opacity = '1';
        }, 300);
    }

    function changePhoto(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = photos.length - 1;
        else if (currentIndex >= photos.length) currentIndex = 0;
        updateAlbum();
    }
    updateAlbum();

    // کدهای مربوط به موزیک
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');
    let isPlaying = false;

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            musicBtn.innerText = '🎵';
            musicBtn.classList.remove('playing');
        } else {
            music.play();
            musicBtn.innerText = '⏸️';
            musicBtn.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }
</script>
</body>
</html>
